services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-smartloan}
    ports:
      - '${DATABASE_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    build: ./keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-smartloan}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-user-management}
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID:-user-management-admin-svc}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
      JWKS_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-user-management}/protocol/openid-connect/certs
      JWT_ISSUER: http://localhost:8080/realms/${KEYCLOAK_REALM:-user-management}

volumes:
  postgres_data:
